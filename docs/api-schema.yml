openapi: 3.0.3
info:
  title: SaaS Pressing API
  version: 1.0.0
  description: API multi-tenant de gestion de pressings (commandes, paiements, notifications
    SMS, livraison) pour le marché du Burkina Faso.
paths:
  /api/v1/accounts/employees/:
    get:
      operationId: v1_accounts_employees_list
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_accounts_employees_create
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreate'
          description: ''
  /api/v1/accounts/employees/{id}/:
    get:
      operationId: v1_accounts_employees_retrieve
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_accounts_employees_update
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdate'
          description: ''
    patch:
      operationId: v1_accounts_employees_partial_update
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdate'
          description: ''
    delete:
      operationId: v1_accounts_employees_destroy
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: POST /api/v1/accounts/login/ — paire de tokens JWT avec claims
        role + pressing_id.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/accounts/login/refresh/:
    post:
      operationId: v1_accounts_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/login/verify/:
    post:
      operationId: v1_accounts_login_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: GET /api/v1/accounts/me/ — profil de l'utilisateur connecté (tous
