openapi: 3.0.3
info:
  title: SaaS Pressing API
  version: 1.0.0
  description: API multi-tenant de gestion de pressings (commandes, paiements, notifications
    SMS, livraison) pour le marché du Burkina Faso.
paths:
  /api/v1/accounts/employees/:
    get:
      operationId: v1_accounts_employees_list
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_accounts_employees_create
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreate'
          description: ''
  /api/v1/accounts/employees/{id}/:
    get:
      operationId: v1_accounts_employees_retrieve
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_accounts_employees_update
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdate'
          description: ''
    patch:
      operationId: v1_accounts_employees_partial_update
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeUpdate'
          description: ''
    delete:
      operationId: v1_accounts_employees_destroy
      description: |-
        Gestion de l'équipe du pressing connecté — réservée au gérant.

        - List/retrieve : membres du pressing uniquement (TenantScopedQuerysetMixin) ;
        - Create : rôle EMPLOYE et pressing forcés depuis le gérant authentifié ;
        - Delete : désactivation (is_active=False), jamais de suppression physique —
          l'historique des commandes rattachées doit rester traçable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) utilisateur.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: POST /api/v1/accounts/login/ — paire de tokens JWT avec claims
        role + pressing_id.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/accounts/login/refresh/:
    post:
      operationId: v1_accounts_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/login/verify/:
    post:
      operationId: v1_accounts_login_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: GET /api/v1/accounts/me/ — profil de l'utilisateur connecté (tous
        rôles).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/clients/:
    get:
      operationId: v1_clients_list
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: v1_clients_create
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/v1/clients/{id}/:
    get:
      operationId: v1_clients_retrieve
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) client.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: v1_clients_update
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) client.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: v1_clients_partial_update
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) client.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    delete:
      operationId: v1_clients_destroy
      description: CRUD clients — accessible à tout le personnel authentifié du pressing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) client.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tenants/profile/:
    get:
      operationId: v1_tenants_profile_retrieve
      description: GET/PATCH /api/v1/tenants/profile/ — branding du pressing connecté.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pressing'
          description: ''
    put:
      operationId: v1_tenants_profile_update
      description: GET/PATCH /api/v1/tenants/profile/ — branding du pressing connecté.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PressingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PressingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pressing'
          description: ''
    patch:
      operationId: v1_tenants_profile_partial_update
      description: GET/PATCH /api/v1/tenants/profile/ — branding du pressing connecté.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPressingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPressingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPressingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pressing'
          description: ''
  /api/v1/tenants/register/:
    post:
      operationId: v1_tenants_register_create
      description: 'Inscrit un pressing et son utilisateur gérant en une requête atomique.
        Réponse : détails de l''établissement + paire de tokens JWT (`access` / `refresh`).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPressingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterPressingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterPressingRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pressing'
          description: ''
components:
  schemas:
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 255
        phone_number:
          type: string
          maxLength: 32
        pressing:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone_number
      - pressing
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - name
      - phone_number
    EmployeeCreate:
      type: object
      description: Création d'un employé par le gérant — rôle et pressing forcés côté
        serveur.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - username
    EmployeeCreateRequest:
      type: object
      description: Création d'un employé par le gérant — rôle et pressing forcés côté
        serveur.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
      required:
      - password
      - username
    EmployeeUpdate:
      type: object
      description: 'Mise à jour d''un employé : infos, activation, réinitialisation
        du mot de passe.'
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
    EmployeeUpdateRequest:
      type: object
      description: 'Mise à jour d''un employé : infos, activation, réinitialisation
        du mot de passe.'
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        password:
          type: string
          writeOnly: true
          minLength: 1
    GerantCreateRequest:
      type: object
      description: Compte gérant créé simultanément au pressing lors de l'inscription.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
      required:
      - password
      - username
    LoginRequest:
      type: object
      description: |-
        Login par numéro de téléphone (username) + mot de passe.

        Enrichit le JWT avec `role` et `pressing_id` : la PWA connaît le rôle de
        l'utilisateur dès la connexion, sans requête supplémentaire.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
    PatchedEmployeeUpdateRequest:
      type: object
      description: 'Mise à jour d''un employé : infos, activation, réinitialisation
        du mot de passe.'
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        password:
          type: string
          writeOnly: true
          minLength: 1
    PatchedPressingRequest:
      type: object
      description: |-
        Représentation d'un pressing — consommé par la PWA pour le theming
        (logo + couleurs appliqués aux variables CSS --primary-color / --secondary-color).
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 255
        address:
          type: string
          title: Adresse
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        owner_name:
          type: string
          title: Propriétaire
          maxLength: 255
        logo:
          type: string
          format: binary
        primary_color:
          type: string
          minLength: 1
          title: Couleur primaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        secondary_color:
          type: string
          minLength: 1
          title: Couleur secondaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
    Pressing:
      type: object
      description: |-
        Représentation d'un pressing — consommé par la PWA pour le theming
        (logo + couleurs appliqués aux variables CSS --primary-color / --secondary-color).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 255
        address:
          type: string
          title: Adresse
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        owner_name:
          type: string
          title: Propriétaire
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
        primary_color:
          type: string
          title: Couleur primaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        secondary_color:
          type: string
          title: Couleur secondaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    PressingRequest:
      type: object
      description: |-
        Représentation d'un pressing — consommé par la PWA pour le theming
        (logo + couleurs appliqués aux variables CSS --primary-color / --secondary-color).
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 255
        address:
          type: string
          title: Adresse
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        owner_name:
          type: string
          title: Propriétaire
          maxLength: 255
        logo:
          type: string
          format: binary
        primary_color:
          type: string
          minLength: 1
          title: Couleur primaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        secondary_color:
          type: string
          minLength: 1
          title: Couleur secondaire
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
      required:
      - name
    RegisterPressingRequest:
      type: object
      description: |-
        Inscription publique : crée le pressing ET son utilisateur gérant en
        une seule requête (voir tenants/services.register_pressing — transaction
        atomique : si le gérant est invalide, le pressing n'est pas créé).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
        phone:
          type: string
          maxLength: 32
        owner_name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: binary
        primary_color:
          type: string
          minLength: 1
          default: '#1E90FF'
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        secondary_color:
          type: string
          minLength: 1
          default: '#FF8C00'
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        gerant:
          $ref: '#/components/schemas/GerantCreateRequest'
      required:
      - gerant
      - name
    RoleEnum:
      enum:
      - GERANT
      - EMPLOYE
      type: string
      description: |-
        * `GERANT` - Gérant
        * `EMPLOYE` - Employé
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      description: Représentation d'un utilisateur de l'équipe (lecture seule).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
        first_name:
          type: string
          readOnly: true
          title: Prénom
        last_name:
          type: string
          readOnly: true
          title: Nom
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rôle
        pressing:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - id
      - is_active
      - last_name
      - pressing
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
