              $ref: '#/components/schemas/MobileMoneyWebhookRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/v1/payments/{id}/:
