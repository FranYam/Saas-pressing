components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CanalEnum:
      enum:
      - COMPTOIR
      - EN_LIGNE
      type: string
      description: |-
        * `COMPTOIR` - Comptoir
        * `EN_LIGNE` - En ligne
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 255
        phone_number:
          type: string
          maxLength: 32
        pressing:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - phone_number
      - pressing
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - name
      - phone_number
    Commande:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
          nullable: true
          title: N° ticket
        client:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/CommandeStatusEnum'
          readOnly: true
          title: Statut
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
          title: Statut paiement
        canal:
          $ref: '#/components/schemas/CanalEnum'
        date_depot:
          type: string
          format: date-time
          readOnly: true
          title: Date de dépôt
        date_retrait_prevue:
          type: string
          format: date-time
          title: Date de retrait prévue
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant total
        collect_address:
          type: string
          title: Adresse de collecte
        delivery_status:
          nullable: true
          title: Statut de livraison
          oneOf:
          - $ref: '#/components/schemas/DeliveryStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        assigned_courier:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: Coursier assigné
        assigned_courier_name:
          type: string
          nullable: true
          readOnly: true
        articles:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        receipt:
          type: string
          description: Reçu texte prêt pour impression thermique ou partage SMS/WhatsApp.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - articles
      - assigned_courier
      - assigned_courier_name
      - client
      - created_at
      - date_depot
      - date_retrait_prevue
      - id
      - payment_status
      - receipt
      - status
      - ticket_number
      - total_price
    CommandeRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
        canal:
          $ref: '#/components/schemas/CanalEnum'
        date_retrait_prevue:
          type: string
          format: date-time
          title: Date de retrait prévue
        collect_address:
          type: string
          title: Adresse de collecte
        delivery_status:
          nullable: true
          title: Statut de livraison
          oneOf:
          - $ref: '#/components/schemas/DeliveryStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
      required:
      - articles
      - client
      - date_retrait_prevue
    CommandeStatusEnum:
      enum:
      - RECU
      - EN_TRAITEMENT
      - PRET
      - LIVRE
      type: string
      description: |-
        * `RECU` - Reçu
        * `EN_TRAITEMENT` - En traitement
        * `PRET` - Prêt
        * `LIVRE` - Livré
    Courier:
      type: object
      description: Représentation d'un coursier (lecture).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nom
        phone_number:
          type: string
          readOnly: true
          title: Téléphone
        is_active:
          type: boolean
          readOnly: true
          title: Actif
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - name
      - phone_number
    DeliveryStatusEnum:
      enum:
      - A_COLLECTER
      - COLLECTE
      - A_LIVRER
      - LIVRE
      type: string
      description: |-
        * `A_COLLECTER` - À collecter
        * `COLLECTE` - Collecté
        * `A_LIVRER` - À livrer
        * `LIVRE` - Livré
    EmployeeCreate:
      type: object
      description: Création d'un employé par le gérant — rôle et pressing forcés côté
        serveur.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - username
    EmployeeCreateRequest:
      type: object
      description: Création d'un employé par le gérant — rôle et pressing forcés côté
        serveur.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
      required:
      - password
      - username
    EmployeeUpdate:
      type: object
      description: 'Mise à jour d''un employé : infos, activation, réinitialisation
        du mot de passe.'
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
    EmployeeUpdateRequest:
      type: object
      description: 'Mise à jour d''un employé : infos, activation, réinitialisation
        du mot de passe.'
      properties:
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        password:
          type: string
          writeOnly: true
          minLength: 1
    GerantCreateRequest:
      type: object
      description: Compte gérant créé simultanément au pressing lors de l'inscription.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
      required:
      - password
      - username
    InitiateMobileMoneyRequest:
      type: object
      description: 'Payload d''initiation : commande + téléphone payeur + opérateur.'
      properties:
        commande:
          type: string
          format: uuid
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        operator:
          $ref: '#/components/schemas/OperatorEnum'
      required:
      - commande
      - operator
      - phone_number
    LoginRequest:
      type: object
      description: |-
        Login par numéro de téléphone (username) + mot de passe.

        Enrichit le JWT avec `role` et `pressing_id` : la PWA connaît le rôle de
        l'utilisateur dès la connexion, sans requête supplémentaire.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    MobileMoneyRequest:
      type: object
      description: Représentation d'une demande Mobile Money (lecture).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        commande:
          type: string
          format: uuid
          readOnly: true
        operator:
          allOf:
          - $ref: '#/components/schemas/OperatorEnum'
          readOnly: true
          title: Opérateur
        phone_number:
          type: string
          readOnly: true
          title: Téléphone payeur
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Montant demandé
        status:
          allOf:
          - $ref: '#/components/schemas/MobileMoneyStatusEnum'
          readOnly: true
          title: Statut
        provider_ref:
          type: string
          readOnly: true
          title: Référence opérateur
        error_message:
          type: string
          readOnly: true
          title: Message d'erreur
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - commande
      - created_at
      - error_message
      - id
      - operator
      - phone_number
      - provider_ref
      - status
    MobileMoneyStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - FAILED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - En attente
        * `CONFIRMED` - Confirmée
        * `FAILED` - Échouée
        * `CANCELLED` - Annulée
    MobileMoneyWebhookRequest:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
          description: Référence opérateur ou UUID de la demande
        status:
          $ref: '#/components/schemas/MobileMoneyWebhookStatusEnum'
        amount:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
      - reference
      - status
    MobileMoneyWebhookStatusEnum:
      enum:
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `SUCCESS` - SUCCESS
        * `FAILED` - FAILED
    ModeEnum:
      enum:
      - ESPECES
      - MOBILE_MONEY
      - CREDIT
      type: string
      description: |-
        * `ESPECES` - Espèces
        * `MOBILE_MONEY` - Mobile Money
        * `CREDIT` - Crédit
    NullEnum:
      enum:
      - null
    OperatorEnum:
      enum:
      - ORANGE
      - MOOV
      type: string
      description: |-
        * `ORANGE` - Orange Money
        * `MOOV` - Moov Money
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        clothing_type:
          type: string
          title: Type de vêtement
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          default: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - clothing_type
      - id
      - unit_price
    OrderItemRequest:
      type: object
      properties:
        clothing_type:
          type: string
          minLength: 1
          title: Type de vêtement
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          default: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - clothing_type
      - unit_price
